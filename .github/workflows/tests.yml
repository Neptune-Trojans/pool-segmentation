# The tests, on every push to main and every pull request; the release workflow runs them too before publishing.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only PyTorch, a smaller download)
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[app,dev]"
      # The browser tests (headless Chrome) run locally, after changing the Labels page
      - run: python -m pytest -m "not browser"
